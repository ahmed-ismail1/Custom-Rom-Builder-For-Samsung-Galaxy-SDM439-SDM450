name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  workflow_dispatch:
    inputs:
      GSI:
        description: 'GSI Image URL (.img.xz, .img.gz, or raw .img)'
        required: true
        default: 'https://github.com/phhusson/treble_experimentations/releases/download/v407/SystemRw_arm64-ab-vanilla.img.xz'
      ARCH:
        description: '64 (ARM64) or 32 (ARM32)'
        required: true
        default: '64'
      ROM_NAME:
        description: 'اسم الروم النهائي (بدون مسافات)'
        required: true
        default: 'LineageOS_19.1_A11_ARM64'

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip xz-utils unzip p7zip-full wget git file gzip

    - name: Clone ROM Builder
      run: |
        git clone --depth=1 --recurse-submodules https://github.com/smiley9000/Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11
        cd Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11
        git submodule update --init --recursive

    - name: Download a11q Tools
      run: |
        wget -O a11q.zip "https://sourceforge.net/projects/a11q/files/a11q.zip"
        mkdir -p Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q
        unzip a11q.zip -d Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q
        rm a11q.zip

    - name: Prepare Workspace
      run: |
        cd Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q
        mkdir -p super/arm${{ github.event.inputs.ARCH }}
        chmod +x *.sh || true
        chmod +x bin/* || true

    - name: Download and Process GSI
      run: |
        cd Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q
        mkdir -p temp
        echo "📥 Downloading GSI from: ${{ github.event.inputs.GSI }}"
        wget -q --show-progress -O temp/gsi_image "${{ github.event.inputs.GSI }}"

        # Detect file type
        file_type=$(file -b temp/gsi_image | awk '{print $1}')
        echo "🧠 Detected file type: $file_type"

        # Handle file types
        case $file_type in
          "XZ")
            echo "🛠️ Processing XZ compressed file"
            mv temp/gsi_image temp/gsi.img.xz
            xz -d -c temp/gsi.img.xz > super/arm${{ github.event.inputs.ARCH }}/super.img
            ;;
          "gzip")
            echo "🛠️ Processing GZIP compressed file"
            mv temp/gsi_image temp/gsi.img.gz
            gunzip -c temp/gsi.img.gz > super/arm${{ github.event.inputs.ARCH }}/super.img
            ;;
          "Android")
            echo "🛠️ Processing raw Android image"
            mv temp/gsi_image super/arm${{ github.event.inputs.ARCH }}/super.img
            ;;
          *)
            echo "❌ Unsupported file type: $file_type"
            file temp/gsi_image
            exit 1
            ;;
        esac

        # Verify and compress
        cd super/arm${{ github.event.inputs.ARCH }}
        if [ ! -s super.img ]; then
          echo "❌ Error: Resulting image is empty!"
          exit 1
        fi
        echo "📦 Compressing super.img..."
        xz -z -T0 -9 super.img
        ls -lh

    - name: Verify GSI Preparation
      run: |
        cd Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q/super/arm${{ github.event.inputs.ARCH }}
        if [ ! -f super.img.xz ]; then
          echo "❌ Error: super.img.xz not found!"
          exit 1
        fi
        echo "✅ GSI ready. Size: $(du -sh super.img.xz)"

    - name: Build ROM
      run: |
        cd Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q
        echo "🏗️ Starting build process..."
        ./arm${{ github.event.inputs.ARCH }}_git || {
          echo "❌ Build failed! Showing logs:";
          cat logs/*.log 2>/dev/null || echo "No logs available";
          exit 1;
        }

    - name: Rename Output File
      run: |
        cd Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q/zip
        if [ -f "Custom_Rom_SDM450.zip" ]; then
          mv "Custom_Rom_SDM450.zip" "${{ github.event.inputs.ROM_NAME }}.zip"
          echo "✅ Renamed to: ${{ github.event.inputs.ROM_NAME }}.zip"
        else
          echo "❌ Original zip file not found!"
          ls -la
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.ROM_NAME }}
        path: Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/a11q/zip/${{ github.event.inputs.ROM_NAME }}.zip
