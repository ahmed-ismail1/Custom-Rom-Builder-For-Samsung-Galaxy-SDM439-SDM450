name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      GSI:
        description: 'Direct link for GSI image'
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20230715-UNOFFICIAL-a64_bgN.img.xz'
      ARCH:
        description: 'ARM64 (aarch64) or ARM32 (arm)?'
        required: true
        default: '32'
      NAME:
        description: 'Output ROM name'
        required: true
        default: 'LineageOS_19.1_A11_M11_ARM32_Gapps'

jobs:
  build-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          zip \
          xz-utils \
          unzip \
          p7zip-full \
          wget \
          git \
          curl

    - name: Prepare workspace
      run: |
        mkdir -p ./temp ./zip
        wget --progress=dot:giga https://sourceforge.net/projects/samsung-galaxy-a01-m01/files/a11q.zip -O a11q.zip
        unzip -q a11q.zip -d .
        rm -f a11q.zip

    - name: Download GSI image
      run: |
        wget --progress=dot:giga "${{ github.event.inputs.GSI }}" -O ./temp/gsi_image.img.xz

    - name: Set permissions
      run: |
        chmod +x ./arm${{ github.event.inputs.ARCH }}_git
        find ./bin/ -type f -exec chmod +x {} \;

    - name: Build ROM
      run: |
        ./arm${{ github.event.inputs.ARCH }}_git

    - name: Verify output
      run: |
        if [ ! -f "./zip/Custom_Rom_SDM450.zip" ]; then
          echo "::error::Build failed - Output file not found!"
          echo "Contents of zip directory:"
          ls -la ./zip/
          exit 1
        fi
        echo "Build completed successfully!"
        ls -lh ./zip/Custom_Rom_SDM450.zip

    - name: Upload ROM artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.NAME }}
        path: ./zip/Custom_Rom_SDM450.zip
        retention-days: 5
